[www]
user = www-data
group = www-data
; let's make sure we have access to the web data -> try VM (and change conf in nginx default)
; Listen on TCP so nginx can reach it via wordpress:9000
listen = 9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no
