services:
 nginx:
  depends_on:
   - wordpress
   - mariadb
  build: requirements/nginx/.
  container_name: nginx
  restart: always
  ports: 
      - "443:443"
  volumes:
      - wordpress_data:/var/www/html  # Mount WordPress data here
  networks:
      - inception
 wordpress:
  depends_on: 
   - mariadb
  build: requirements/wordpress/. # where to find the dockerfile that tells us how the image is build
  container_name: wordpress # how to name the container
  restart: always
  volumes:
      - wordpress_data:/var/www/html  # Mount WordPress data here
  env_file:
      - ./.env
  secrets:
      - db_password
  networks:
      - inception
 mariadb:
  build: requirements/mariadb/.
  container_name: mariadb
  restart: always
  volumes: 
      - mariadb_data:/var/lib/mysql  # Mount MariaDB data here
  env_file:
      - ./.env
  secrets:
      - db_password
      - db_root_password
  networks:
      - inception

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt  # Secret for the root password
  db_password:
    file: ../secrets/db_password.txt      # Secret for the wpuser password

volumes:
 wordpress_data: 
   name: wordpress_data
   driver: local
   driver_opts:
     type: none
     device: /home/jasnguye/data/wordpress
     o: bind
 mariadb_data: 
   name: mariadb_data
   driver: local
   driver_opts:
     type: none
     device: /home/jasnguye/data/mariadb
     o: bind   


networks:
      inception:
        driver: bridge
  
  


  
