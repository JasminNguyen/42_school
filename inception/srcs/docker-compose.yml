services:
 nginx:
  depends_on:
   - wordpress
   - mariadb
  build: requirements/nginx/.
  container_name: nginx
  ports: 
      - "443:443"
  volumes:
      - /home/jasnguye/data/wordpress:/var/www/html  # Mount WordPress data here
  networks:
      inception:
 wordpress:
  depends_on: 
   - mariadb
  build: requirements/wordpress/. # where to find the dockerfile that tells us how the image is build
  container_name: wordpress # how to name the container
  volumes:
      - /home/jasnguye/data/wordpress:/var/www/html  # Mount WordPress data here
  environment:
    WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
    WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
    WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
    WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
  networks:
      inception:
 mariadb:
  build: requirements/mariadb/.
  container_name: mariadb
  volumes: 
      - /home/jasnguye/data/mariadb:/var/lib/mysql  # Mount MariaDB data here
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  networks:
      inception:


networks:
      inception:
  
  


  
